        .font-size-container { display: flex; align-items: center; gap: 8px; margin-top: 4px; margin-bottom: 8px; }
        .font-size-container input[type="range"] { flex: 1; cursor: pointer; }

        .btn-download { background: #0284c7; color: white; border: none; margin-top: 5px; }
        .btn-download:hover { background: #0369a1; }

    </style>
</head>

    <div id="controls" class="panel">

        <label for="clusteringMethod">Método de Agrupación:</label>
        <select id="clusteringMethod" onchange="applyClustering()">

            <option value="compacto">Vista Estática Unificada</option>
            <option value="louvain">Algoritmo Louvain / Comunidades</option>
        </select>

        <button class="btn-download" onclick="downloadPNG()">Descargar Grafo (PNG)</button>

        var minYearGlobal = 2017;
        var maxYearGlobal = 2026;

        function hexToRgb(hex) {
            var c = hex.replace('#', '');
            if (c.length === 3) c = c.split('').map(x => x + x).join('');
            var num = parseInt(c, 16);
            return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
        }

        function interpolateColor(color1Hex, color2Hex, factor) {
            var c1 = hexToRgb(color1Hex);
            var c2 = hexToRgb(color2Hex);
            var r = Math.round(c1[0] + factor * (c2[0] - c1[0]));
            var g = Math.round(c1[1] + factor * (c2[1] - c1[1]));
            var b = Math.round(c1[2] + factor * (c2[2] - c1[2]));
            return "rgb(" + r + "," + g + "," + b + ")";
        }

        function getColorForYear(year, colorStart, colorEnd) {
            var ratio = (year - minYearGlobal) / Math.max(1, (maxYearGlobal - minYearGlobal));
            ratio = Math.max(0, Math.min(1, ratio));
            return interpolateColor(colorStart, colorEnd, ratio);
        }

        function buildTooltip(node, metricKey, metricLabel) {
            return "<b>Keyword:</b> " + node.id + "<br>" +
                   "<b>" + metricLabel + ":</b> " + node[metricKey] + "<br>" +
                   "<b>Repeticiones:</b> " + node.count;
        }

        var nodes = new vis.DataSet([]);
        var edges = new vis.DataSet(edgesData);

        var container = document.getElementById('network');
        var data = { nodes: nodes, edges: edges };

        var options = {
            nodes: {
                shape: 'dot',
                scaling: {
                    min: 10,
                    max: 30,
                    label: {
                        enabled: true,
                        min: 10,
                        max: 26,
                        maxVisible: 30,
                        drawThreshold: 5
                    }
                },
                font: { 
                    size: 12, 
                    face: 'Arial', 
                    color: '#0f172a', 
                    strokeWidth: 3, 
                    strokeColor: '#ffffff' 
                },
                borderWidth: 1.5,
                borderColor: '#1e293b'
            },
            edges: {
                color: { color: '#cbd5e1', highlight: '#0284c7' },
                smooth: { type: 'continuous' },
                selectionWidth: 2
            },
            interaction: { hover: true, tooltipDelay: 10 },
            physics: {
                enabled: true,
                solver: 'forceAtlas2Based',
                forceAtlas2Based: {
                    gravitationalConstant: -35,
                    centralGravity: 0.02,
                    springLength: 70,
                    springConstant: 0.08,
                    avoidOverlap: 0.9
                },
                stabilization: { enabled: true, iterations: 150 }
            }
        };

        var network = new vis.Network(container, data, options);

        network.on("stabilizationIterationsDone", function () {
            network.setOptions({ physics: { enabled: false } });
        });

        function updateFontSize(val) {
            var size = parseInt(val);
            if (isNaN(size)) return;
            size = Math.max(1, Math.min(100, size));

            document.getElementById('fontSizeSlider').value = size;
            document.getElementById('fontSizeInput').value = size;

            network.setOptions({
                nodes: {
                    font: {
                        size: size
                    }
                }
            });
        }

        function updateColors() {
            var metric = document.getElementById('yearMetric').value;
            var colorStart = document.getElementById('colorStart').value;
            var colorEnd = document.getElementById('colorEnd').value;

            var labelMap = {
                'primer_año': 'Primer Año',
                'media_año': 'Año Medio',
                'mediana_año': 'Año Mediana',
                'ultimo_año': 'Último Año'
            };

            var updatedNodes = [];
            rawNodes.forEach(function(node) {
                var val = node[metric];
                var newColor = getColorForYear(val, colorStart, colorEnd);
                var newTitle = buildTooltip(node, metric, labelMap[metric]);

                updatedNodes.push({
                    id: node.id,
                    label: node.label,
                    value: node.value,
                    x: node.x,
                    y: node.y,
                    color: newColor,
                    title: newTitle
                });
            });

            nodes.clear();
            nodes.add(updatedNodes);

            // Actualizar barra de gradiente en la leyenda
            var gradientBar = document.getElementById('gradientBar');
            gradientBar.style.background = 'linear-gradient(to right, ' + colorStart + ', ' + colorEnd + ')';
        }

        // Inicializar
        updateColors();

        function applyClustering() {
            var method = document.getElementById('clusteringMethod').value;

            if (method === 'tematica') {
                network.setOptions({ physics: { enabled: true } });
                nodes.forEach(function(node) {
                    var raw = rawNodes.find(n => n.id === node.id);
                    var cx = raw.tema === "Recursos Humanos y Gestión" ? -300 : (raw.tema === "Teoría de Grafos y Modelos Relacionales" ? 300 : 0);
                    var cy = raw.tema === "Data Analytics y Machine Learning" ? -250 : 200;
                    nodes.update({ id: node.id, x: cx + (Math.random() * 20 - 10), y: cy + (Math.random() * 20 - 10) });
                });
            } else if (method === 'compacto') {
                network.setOptions({ physics: { enabled: false } });
                nodes.forEach(function(node) {
                    var raw = rawNodes.find(n => n.id === node.id);
                    nodes.update({ id: node.id, x: raw.x_glob, y: raw.y_glob });
                });
            } else if (method === 'louvain') {
                network.setOptions({
                    physics: {
                        enabled: true,
                        solver: 'forceAtlas2Based',
                        forceAtlas2Based: { centralGravity: 0.015, springLength: 50 }
                    }
                });
            }
        }

        function downloadPNG() {
            network.on("afterDrawing", function (ctx) {
                var dataURL = ctx.canvas.toDataURL("image/png");
                var link = document.createElement('a');
                link.href = dataURL;
                link.download = 'grafo_keywords.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
            network.redraw();
        }
